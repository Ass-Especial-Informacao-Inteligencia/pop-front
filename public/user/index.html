<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home | Entrevistador</title>
        <!-- imagem para icone de aba -->
        <link
            rel="icon"
            type="image/x-icon"
            href="./src/BRASAO-PREFEITURA-DE-FERRAZ.png"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/mainUser.css" />
        <!-- Import do jQuery -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <!-- icones import -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        />
    </head>
    <body>
        <!-- Marca D´agua de fundo -->
        <img src="./src/SloganFerraz.png" class="watermark" alt="">

        <!-- Navbar (injetada via JS) -->
        <div id="navbarPlaceholder"></div>

        <!-- Conteúdo Principal -->
        <main id="conteudo">
        <div class="container mt-5">
            <div class="jumbotron home-jumbotron">
                <h1 class="display-5">Bem-vindo ao POP</h1>
                <p class="lead">
                    Pesquisa de Opinião Popular da Prefeitura Municipal de Ferraz de
                    Vasconcelos.
                </p>
            </div>
        </div>
        
        <!-- Ordenação e filtro dos cards -->
        <div class="container mt-4" id="sortBar">
            <div class="sort-bar">
                <div class="filtro-status btn-group btn-group-toggle" id="filtroStatus" data-toggle="buttons" role="group" aria-label="Filtrar formulários por situação">
                    <label class="btn active">
                        <input type="radio" name="filtroStatus" value="todos" checked autocomplete="off"> Todos
                    </label>
                    <label class="btn">
                        <input type="radio" name="filtroStatus" value="respondidos" autocomplete="off"> Respondidos
                    </label>
                    <label class="btn">
                        <input type="radio" name="filtroStatus" value="pendentes" autocomplete="off"> Pendentes
                    </label>
                </div>
                <label for="sortSelect" class="sort-label">Ordenar por:</label>
                <select id="sortSelect" class="form-control sort-select">
                    <option value="recentes" selected>Mais recentes</option>
                    <option value="az">Título A–Z</option>
                    <option value="za">Título Z–A</option>
                </select>
            </div>
        </div>

        <!-- Seção de Cards | gerada no arquivo js geraCardsForm -->
        <div id="cardContainer" class="container mt-6 mb-5"></div>

        <!-- Região viva para anúncio do resultado da busca de formulários -->
        <div id="sr-live" role="status" aria-live="polite"></div>
        </main>

        <!-- Componentes compartilhados (injetados via JS) -->
        <div id="perfilModalPlaceholder"></div>
        <div id="sharedComponents"></div>
        
        <!-- BOOTSTRAP -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
        <!-- IMPORTS JS -->
        <script type="module" src="./indexUser.js"></script>
        <script src="./js/barraPesquisa.js"></script>
    </body>
</html>
