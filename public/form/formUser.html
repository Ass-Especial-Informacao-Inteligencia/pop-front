<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Visualização do Formulário</title>
        <link rel="stylesheet" href="./css/mainForm.css" />
        <link rel="icon" type="image/x-icon" href="../src/BRASAO-PREFEITURA-DE-FERRAZ.png"/>
        <!-- icones import -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet"/>
    </head>
    <body>
        
        <!-- Cabeçalho de navegação -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <a class="navbar-brand" href="/home">
                <img
                    src="../src/BRASAO-PREFEITURA-DE-FERRAZ.png"
                    width="30"
                    height="30"
                    class="d-inline-block align-top"
                    alt="Logo"
                />
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="logout-conta" href="#"
                            >Sair</a
                        >
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="/home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-toggle="modal" data-target="#perfilModal" style="cursor: pointer !important;">Perfil</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <div class="form-image-container">
            <img src="../src/SloganFerraz.png" alt="Imagem do Formulário" class="form-image">
        </div>

        <div class="container mt-5">
            <div class="jumbotron">
                <h1 id="form-title">Titulo Formulário</h1>
                <p id="form-description">descrição:</p>
            </div>
        </div>

        <!-- view formulario -->
        <div class="container mt-5 mb-5" id="formulario-container"></div>

        <!-- Componentes compartilhados (injetados via JS) -->
        <div id="perfilModalPlaceholder"></div>
        <div id="sharedComponents"></div>

        <!-- Modal de Pergunta se desse cadastrar mais resposta -->
        <div class="modal fade" id="confirmacaoModal" tabindex="-1" role="dialog" aria-labelledby="confirmacaoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-top" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmacaoModalLabel">Respostas Salvas</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body text-center">
                        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                        <p>Suas respostas foram salvas com sucesso!</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" onclick="window.location.reload()">Cadastrar Novas Respostas</button>
                        <a class="btn btn-secondary" href="/home">Início</a>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
        <script src="./indexForm.js" type="module"></script>
        <script src="./js/geraFormularioParaResposta.js" type="module"></script>
    </body>
</html>
