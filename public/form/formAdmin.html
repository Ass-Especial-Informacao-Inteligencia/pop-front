<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gerenciar Formulário</title>
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/mainForm.css" />
        <link
            rel="icon"
            type="image/x-icon"
            href="../src/BRASAO-PREFEITURA-DE-FERRAZ.png"
        />
        <!-- icones import -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        />
    </head>
    <body>

        <!-- Navbar (injetada via JS) -->
        <div id="navbarPlaceholder"></div>
        
        <!-- Head da pagina -->
        <div class="container mt-5">
            <div class="jumbotron">
                <h1 id="form-title">Titulo Formulário</h1>
                <p id="form-description">descrição:</p>
                <button
                    id="btnEditarTituloDescricao"
                    class="editFormInfo btn btn-primary"
                    data-toggle="modal"
                    data-target="#editarTitulosModal"
                >
                    Editar Título ou Descrição
                </button>
            </div>
        </div>

        <!-- Conteudo Principal -->
        <div class="container mt-8 mb-5 d-flex flex-column">
            <form id="formulario" class="flex-grow-1">
                <!-- perguntas vão ser geradas aqui! -->
                <div id="questions-container"></div>

                <div class="d-flex justify-content-end">
                    <button id="btnSalvarForm" type="submit" class="btn btn-success mr-2">
                        Salvar
                    </button>
                    <button id="btnAddQuestionForm" type="button" class="btn btn-primary addQuestion mr-2">
                        Adicionar Questão
                    </button>
                    <button id="btnRecycleQuestionForm" type="button" class="btn btn-secondary searchAndAddQuestion" data-toggle="modal" data-target="#pesquisarQuestaoModal">
                        <i class="fas fa-search"></i> <i class="fas fa-plus"></i> Questão
                    </button>
                </div>
            </form>
        </div>

        <!-- Modal de Perfil -->
        <div id="perfilModalPlaceholder"></div>

        <div
            class="modal fade"
            id="editarTitulosModal"
            tabindex="-1"
            role="dialog"
            aria-labelledby="editarModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editarModalLabel">
                            Editar Título ou Descrição
                        </h5>
                        <button
                            type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Fechar"
                        >
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <label for="titulo">Título</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="titulo"
                                    placeholder="Insira o título"
                                />
                            </div>
                            <div class="form-group">
                                <label for="descricao">Descrição</label>
                                <textarea
                                    class="form-control"
                                    id="descricao"
                                    placeholder="Insira a descrição"
                                ></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal"
                        >
                            Cancelar
                        </button>
                        <button type="button" class="saveFormInfoChanges btn btn-primary">
                            Salvar Alterações
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal para Pesquisar e Adicionar Questão -->
        <div
            class="modal fade"
            id="pesquisarQuestaoModal"
            tabindex="-1"
            role="dialog"
            aria-labelledby="pesquisarQuestaoModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="pesquisarQuestaoModalLabel">
                            Pesquisar Questões já Cadastradas
                        </h5>
                        <button
                            type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Fechar"
                        >
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="search-question">Pesquisar Questão</label>
                            <input
                                type="text"
                                class="form-control"
                                id="search-question"
                                placeholder="Digite a questão para pesquisar"
                                aria-describedby="search-question-help"
                            />
                            <small id="search-question-help" class="form-text text-muted">
                                Comece a digitar para filtrar as questões disponíveis.
                            </small>
                        </div>
                        <div id="search-results" class="overflow-auto scroll-container-md">
                            <!-- Resultados da pesquisa serão exibidos aqui -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-dismiss="modal"
                        >
                            Cancelar
                        </button>
                        <button
                            type="button"
                            class="btn btn-primary"
                            id="btn-select-question"
                            data-dismiss="modal"
                        >
                            Adicionar Questão
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Componentes compartilhados (injetados via JS) -->
        <div id="sharedComponents"></div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
        <script src="./indexForm.js" type="module"></script>
    </body>
</html>
