<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
         <!-- icones import -->
   <link
   rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
        <!-- imagem para icone de aba -->
         
        <link
            rel="icon"
            type="image/x-icon"
            href="./src/BRASAO-PREFEITURA-DE-FERRAZ.png"
        />
        <link rel="stylesheet" href="./styles.css" />
        <title>Login | POP</title>
        <script src="./js/index.js" type="module"></script>
    </head>
    <body>

        <!-- background do body -->
        <img src="./src/ferraz-predio-imagem.jpeg" id="imagem-fundo-login" class="img-fluid" alt="Imagem de fundo">

        <div class="container" id="container">

            <div class="form-container sign-in-container">
                <form id="sign-in-form" aria-label="Formulário de login">
                    <h1>Login</h1>
                    <span>use seu login</span>
                    <label for="sign-in-cpf-email" class="sr-only">CPF ou Email</label>
                    <input
                        required
                        type="text"
                        placeholder="CPF ou Email"
                        id="sign-in-cpf-email"
                        autocomplete="username"
                    />
                    <label for="sign-in-password" class="sr-only">Senha</label>
                    <input
                        required
                        type="password"
                        placeholder="Senha"
                        id="sign-in-password"
                        autocomplete="current-password"
                    />
                    <span class="text-danger" id="errorMessage" role="alert"></span><br>
                   
                    <button type="submit" id="signInButton">Login</button><br>
                    <span>Esqueceu sua senha? Procure um Administrador.</span>
                    
                </form>
            </div>
            <div class="overlay-container">
                <div class="overlay"> 
                    <div class="overlay-panel overlay-right">
                        <img src="./src/BRASAO-PREFEITURA-DE-FERRAZ.png" width="80" alt="Brasão da Prefeitura de Ferraz de Vasconcelos"><br>
                        <h1>Bem vindo(a)</h1>
                        <p>
                           ao POP a pesquisa de opinião popular da Prefeitura Municipal de Ferraz de Vasconcelos.
                        </p>
                    </div>
                </div>
            </div>
        </div>
           
        <!-- JQUERY -->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <!-- BOOTSTRAP -->
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    </body>

</html>
